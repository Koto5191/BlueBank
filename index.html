<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>KotokiBank</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="card">
    <h1>🏦 KotokiBank</h1>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 ダーク</button>

    <!-- カードイラスト -->
    <div class="card-illust-wrap">
      <button class="illust-arrow left" onclick="prevIllust()">‹</button>
      <img class="card-illust" id="card-illust" src="card1.png" alt="card" />
      <button class="illust-arrow right" onclick="nextIllust()">›</button>
    </div>

    <!-- 口座タブ -->
    <div class="tabs">
      <button class="tab active" id="tab-normal" onclick="switchAccount('normal')">通常</button>
      <button class="tab" id="tab-savings" onclick="switchAccount('savings')">貯金</button>
      <button class="tab" id="tab-koto" onclick="switchAccount('koto')">Koto</button>
    </div>

    <!-- ロック画面（出金用） -->
    <div id="lock-screen" style="display:none;">
      <div class="lock-icon">🔒</div>
      <div class="lock-text">出金にはパスワードが必要です</div>
      <input type="password" id="password-input" placeholder="パスワードを入力" />
      <div id="password-error"></div>
      <button class="unlock-btn" onclick="tryUnlock()">解除して出金</button>
      <button class="cancel-btn" onclick="cancelUnlock()">キャンセル</button>
    </div>

    <!-- メイン画面 -->
    <div id="main-screen">

      <!-- Koto口座専用パネル -->
      <div id="koto-panel" style="display:none;">
        <div class="koto-section">
          <div class="koto-label">自分の貯金</div>
          <div class="balance" id="balance">¥0</div>
          <div id="next-goal"></div>
          <input type="number" id="amount" placeholder="金額を入力" />
          <br>
          <button class="deposit" onclick="deposit()">入金</button>
          <button class="withdraw" onclick="withdraw()">出金</button>
        </div>

        <div class="koto-divider"></div>

        <div class="koto-section">
          <div class="koto-label">📤 貸付中</div>
          <div class="loan-balance" id="loan-balance">¥0</div>
          <input type="number" id="loan-amount" placeholder="金額を入力" />
          <br>
          <button class="deposit" onclick="loanAdd()">追加</button>
          <button class="withdraw" onclick="loanReduce()">返済</button>
        </div>

        <h3>📜 履歴</h3>
        <ul id="history"></ul>
      </div>

      <!-- 通常・貯金口座パネル -->
      <div id="normal-panel">
        <div>残高</div>
        <div class="balance" id="balance-normal">¥0</div>
        <div id="next-goal-normal"></div>
        <input type="number" id="amount-normal" placeholder="金額を入力" />
        <br>
        <button class="deposit" onclick="deposit()">入金</button>
        <button class="withdraw" onclick="withdraw()">出金</button>
        <h3>📜 履歴</h3>
        <ul id="history-normal"></ul>
      </div>

    </div>
  </div>

<script>
/* =========================
   🔥 Firebase初期化
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyBnbPO7vnZg4ohzCQqTjML4u0Gt2rvX17w",
  authDomain: "bluebank-5191.firebaseapp.com",
  projectId: "bluebank-5191",
  storageBucket: "bluebank-5191.firebasestorage.app",
  messagingSenderId: "898172429411",
  appId: "1:898172429411:web:51198f69778744fa2a4456"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================
   🏦 状態
========================= */
const ACCOUNT_TYPES = ["normal", "savings", "koto"];
const SAVINGS_PASSWORD = "1121";
let pendingWithdrawAmount = null;

let accounts = {
  normal:  { balance: 0, history: [] },
  savings: { balance: 0, history: [] },
  koto:    { balance: 0, history: [], loan: 73000 }
};
let currentAccount = localStorage.getItem("currentAccount") || "normal";

function current() {
  return accounts[currentAccount];
}

/* =========================
   🖼 イラスト
========================= */
const ILLUST_COUNT = 4;
let illustIndex = Number(localStorage.getItem("illustIndex") || 0);

function updateIllust() {
  document.getElementById("card-illust").src = "card" + (illustIndex + 1) + ".png";
  localStorage.setItem("illustIndex", illustIndex);
}

function prevIllust() {
  illustIndex = (illustIndex - 1 + ILLUST_COUNT) % ILLUST_COUNT;
  updateIllust();
}

function nextIllust() {
  illustIndex = (illustIndex + 1) % ILLUST_COUNT;
  updateIllust();
}

/* =========================
   🔒 ロック（出金用）
========================= */
function showLock() {
  document.getElementById("lock-screen").style.display = "block";
  document.getElementById("main-screen").style.display = "none";
  document.getElementById("password-input").value = "";
  document.getElementById("password-error").innerText = "";
}

function showMain() {
  document.getElementById("lock-screen").style.display = "none";
  document.getElementById("main-screen").style.display = "block";
}

function tryUnlock() {
  const input = document.getElementById("password-input").value;
  if (input === SAVINGS_PASSWORD) {
    showMain();
    if (pendingWithdrawAmount !== null) {
      doWithdraw(pendingWithdrawAmount);
      pendingWithdrawAmount = null;
    }
  } else {
    document.getElementById("password-error").innerText = "❌ パスワードが違います";
    document.getElementById("password-input").value = "";
  }
}

function cancelUnlock() {
  pendingWithdrawAmount = null;
  showMain();
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("password-input").addEventListener("keydown", e => {
    if (e.key === "Enter") tryUnlock();
  });
});

/* =========================
   🔀 口座切替
========================= */
function switchAccount(type) {
  currentAccount = type;
  localStorage.setItem("currentAccount", type);

  ACCOUNT_TYPES.forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("active", t === type);
  });

  showMain();
  renderPanel();
  render();
}

function renderPanel() {
  const isKoto = currentAccount === "koto";
  document.getElementById("koto-panel").style.display = isKoto ? "block" : "none";
  document.getElementById("normal-panel").style.display = isKoto ? "none" : "block";
}

/* =========================
   📥 初期ロード
========================= */
window.onload = async function () {
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    document.querySelector(".theme-toggle").innerText = "☀️ ライト";
  }

  updateIllust();

  ACCOUNT_TYPES.forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("active", t === currentAccount);
  });

  for (const type of ACCOUNT_TYPES) {
    const doc = await db.collection("bank").doc(type).get();
    if (doc.exists) {
      accounts[type].balance = doc.data().balance || 0;
      accounts[type].history = doc.data().history || [];
      if (type === "koto") {
        accounts[type].loan = doc.data().loan !== undefined ? doc.data().loan : 73000;
      }
    }
  }

  showMain();
  renderPanel();
  render();
};

/* =========================
   🎨 画面更新
========================= */
function render() {
  if (currentAccount === "koto") {
    const { balance, history, loan } = current();

    const balanceEl = document.getElementById("balance");
    balanceEl.classList.remove("pop");
    void balanceEl.offsetWidth;
    balanceEl.classList.add("pop");
    balanceEl.innerText = "¥" + balance.toLocaleString();

    const nextMan = Math.ceil((balance + 1) / 10000) * 10000;
    const diff = nextMan - balance;
    document.getElementById("next-goal").innerText = "あと¥" + diff.toLocaleString() + "で" + (nextMan / 10000) + "万円！";

    document.getElementById("loan-balance").innerText = "¥" + loan.toLocaleString();

    const list = document.getElementById("history");
    list.innerHTML = "";
    history.slice().reverse().forEach(text => {
      const li = document.createElement("li");
      li.innerText = text;
      list.appendChild(li);
    });

  } else {
    const { balance, history } = current();

    const balanceEl = document.getElementById("balance-normal");
    balanceEl.classList.remove("pop");
    void balanceEl.offsetWidth;
    balanceEl.classList.add("pop");
    balanceEl.innerText = "¥" + balance.toLocaleString();

    const nextMan = Math.ceil((balance + 1) / 10000) * 10000;
    const diff = nextMan - balance;
    document.getElementById("next-goal-normal").innerText = "あと¥" + diff.toLocaleString() + "で" + (nextMan / 10000) + "万円！";

    const list = document.getElementById("history-normal");
    list.innerHTML = "";
    history.slice().reverse().forEach(text => {
      const li = document.createElement("li");
      li.innerText = text;
      list.appendChild(li);
    });
  }
}

/* =========================
   💾 保存（Firebase）
========================= */
function save() {
  const acc = current();
  const data = { balance: acc.balance, history: acc.history };
  if (currentAccount === "koto") data.loan = acc.loan;
  db.collection("bank").doc(currentAccount).set(data);
}

/* =========================
   📦 金額取得
========================= */
function getAmount() {
  const id = currentAccount === "koto" ? "amount" : "amount-normal";
  return Number(document.getElementById(id).value);
}

function getLoanAmount() {
  return Number(document.getElementById("loan-amount").value);
}

/* =========================
   📜 履歴追加
========================= */
function addHistory(text) {
  current().history.push(text);
}

/* =========================
   💰 入金
========================= */
function deposit() {
  const amount = getAmount();
  if (!amount || amount <= 0) {
    addHistory("⚠ 正しい金額を入力してね");
    render(); save(); return;
  }
  current().balance += amount;
  addHistory("＋ ¥" + amount.toLocaleString() + " 入金");
  render(); save();
}

/* =========================
   💸 出金
========================= */
function withdraw() {
  const amount = getAmount();
  if (!amount || amount <= 0) {
    addHistory("⚠ 正しい金額を入力してね");
    render(); save(); return;
  }
  if (currentAccount === "savings") {
    pendingWithdrawAmount = amount;
    showLock();
    return;
  }
  doWithdraw(amount);
}

function doWithdraw(amount) {
  if (current().balance < amount) {
    addHistory("⚠ 残高不足で失敗");
    render(); save(); return;
  }
  current().balance -= amount;
  addHistory("－ ¥" + amount.toLocaleString() + " 出金");
  render(); save();
}

/* =========================
   📤 貸付操作
========================= */
function loanAdd() {
  const amount = getLoanAmount();
  if (!amount || amount <= 0) {
    addHistory("⚠ 正しい金額を入力してね");
    render(); save(); return;
  }
  current().loan += amount;
  addHistory("📤 貸付 ＋¥" + amount.toLocaleString());
  render(); save();
}

function loanReduce() {
  const amount = getLoanAmount();
  if (!amount || amount <= 0) {
    addHistory("⚠ 正しい金額を入力してね");
    render(); save(); return;
  }
  if (current().loan < amount) {
    addHistory("⚠ 返済額が貸付残高を超えています");
    render(); save(); return;
  }
  current().loan -= amount;
  addHistory("✅ 返済 ¥" + amount.toLocaleString());
  render(); save();
}

/* =========================
   🌙 テーマ切替
========================= */
function toggleTheme() {
  const isDark = document.body.classList.toggle("dark");
  document.querySelector(".theme-toggle").innerText = isDark ? "☀️ ライト" : "🌙 ダーク";
  localStorage.setItem("theme", isDark ? "dark" : "light");
}
</script>

</body>
</html>
